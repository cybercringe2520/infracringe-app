# Serves the static Next.js export. Used inside the web container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # /blog/post0/ -> /blog/post0/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Built JS and CSS have content hashes in their names, so they can be cached for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
