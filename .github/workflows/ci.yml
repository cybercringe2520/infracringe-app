name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@<CHECKOUT_SHA> # <CHECKOUT_TAG>
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@<SETUP_GO_SHA> # <SETUP_GO_TAG>
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@<SETUP_NODE_SHA> # <SETUP_NODE_TAG>
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run tests, lint and build
        run: make test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@<CHECKOUT_SHA> # <CHECKOUT_TAG>
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the whole Git history for secrets
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:<GITLEAKS_TAG>
          git --redact --verbose .
